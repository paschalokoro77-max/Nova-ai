<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060A13" />
    <title>NovaTrade AI — Autonomous Trading Research & Paper Platform</title>
    <meta
      name="description"
      content="Full-stack autonomous AI trading research and paper-trading platform with quantitative analysis, Supabase persistence, and IQ Option broker integration."
    />
    <meta property="og:title" content="NovaTrade AI — Autonomous Trading Research & Paper Platform" />
    <meta
      property="og:description"
      content="Full-stack autonomous AI trading research and paper-trading platform with quantitative analysis, Supabase persistence, and IQ Option broker integration."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('novatrade_theme_v1') || 'system';
          var isDark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) root.classList.add('dark');
          else root.classList.remove('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#060A13' : '#F8FAFC');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 dark:bg-[#060A13] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
